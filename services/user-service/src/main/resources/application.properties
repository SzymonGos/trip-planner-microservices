spring.application.name=user-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5433/users_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://proven-snail-10.clerk.accounts.dev
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://proven-snail-10.clerk.accounts.dev/.well-known/jwks.json

app.services.media.url=http://localhost:8083

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never